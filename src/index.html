<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A picture memory match game for kids, with levels, a timer and best scores." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Memory Match</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      // Apply a saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('memory-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="js/dom.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Memory Match</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"></button>
      </header>

      <div id="levels" class="levels" role="group" aria-label="Level"></div>

      <dl class="scoreboard" aria-label="Scoreboard">
        <div><dt>Time</dt><dd id="time">0:00</dd></div>
        <div><dt>Tries</dt><dd id="tries">0</dd></div>
        <div><dt>Best</dt><dd id="best">–</dd></div>
      </dl>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div id="board" class="board" role="group" aria-label="Memory tiles"></div>

      <div class="actions">
        <button id="reset" class="reset" type="button">New game</button>
      </div>
    </main>

    <dialog id="win-dialog" class="dialog" aria-labelledby="win-title" aria-describedby="win-summary">
      <div class="dialog__card">
        <div id="win-badge" class="dialog__badge" aria-hidden="true">🎉</div>
        <h2 id="win-title" class="dialog__title"></h2>
        <p id="win-summary" class="dialog__summary"></p>
        <button id="play-again" class="reset" type="button">Play again</button>
      </div>
    </dialog>

    <noscript>This game requires JavaScript.</noscript>
  </body>
</html>
